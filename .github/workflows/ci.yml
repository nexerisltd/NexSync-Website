name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd "D:\4. Projects\31. NexSync\Website\Vercel"
          bun install

      - name: Run ESLint
        run: |
          cd "D:\4. Projects\31. NexSync\Website\Vercel"
          bun run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd "D:\4. Projects\31. NexSync\Website\Vercel"
          bun install

      - name: Run tests
        run: |
          cd "D:\4. Projects\31. NexSync\Website\Vercel"
          bun test --coverage